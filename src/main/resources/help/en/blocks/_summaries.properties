Bool.And=Logical AND. Output Y is 1 only when all inputs are 1.
Bool.Nand=Logical NAND. Output Y is 0 only when all inputs are 1.
Bool.Or=Logical OR. Output Y is 1 when at least one input is 1.
Bool.Nor=Logical NOR. Output Y is 1 only when all inputs are 0.
Bool.Xor=Logical exclusive OR. Output Y is 1 when an odd number of inputs are 1.
Bool.Xnor=Logical equivalence (XNOR). Output Y is 1 when an even number of inputs are 1.
Bool.Not=Logical inverter. Output Y is the inverse of input X.
Bool.RS=Reset-dominant bistable latch. If both S and R are 1, Q resets to 0.
Bool.SR=Set-dominant bistable latch. If both S and R are 1, Q sets to 1.
Math.Add=Adds all connected inputs and outputs the sum on Y.
Math.Sub=Subtracts subsequent inputs from X1 and outputs the difference on Y.
Math.Mul=Multiplies all connected inputs and outputs the product on Y.
Math.Div=Divides A by B. Sets Err=1 if B is zero.
Math.Mod=Computes remainder A mod B. Sets Err=1 if B is zero.
Math.Min=Outputs the minimum value among all inputs.
Math.Max=Outputs the maximum value among all inputs.
