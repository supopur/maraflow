Bool.And=Logický součin (AND). Výstup Y je 1 pouze tehdy, jsou-li všechny vstupy 1.
Bool.Nand=Negovaný logický součin (NAND). Výstup Y je 0 pouze tehdy, jsou-li všechny vstupy 1.
Bool.Or=Logický součet (OR). Výstup Y je 1, pokud je alespoň jeden vstup 1.
Bool.Nor=Negovaný logický součet (NOR). Výstup Y je 1 pouze tehdy, jsou-li všechny vstupy 0.
Bool.Xor=Výlučné NEBO (XOR). Výstup Y je 1 při lichém počtu jedniček na vstupech.
Bool.Xnor=Logická ekvivalence (XNOR). Výstup Y je 1 při sudém počtu jedniček na vstupech.
Bool.Not=Logický invertor (NOT). Výstup Y je negací vstupu X.
Bool.RS=Bistabilní klopný obvod s dominantním resetem. Pokud jsou S=1 i R=1, Q se vynuluje na 0.
Bool.SR=Bistabilní klopný obvod s dominantním setem. Pokud jsou S=1 i R=1, Q se nastaví na 1.
Math.Add=Sečte všechny připojené vstupy a výsledek zapíše na výstup Y.
Math.Sub=Odečte další vstupy od X1 a rozdíl zapíše na výstup Y.
Math.Mul=Vynásobí všechny připojené vstupy a součin zapíše na výstup Y.
Math.Div=Vydělí A hodnotou B. Při dělení nulou nastaví Err=1.
Math.Mod=Vypočítá zbytek po dělení A mod B. Při B=0 nastaví Err=1.
Math.Min=Na výstup Y předá nejmenší hodnotu ze všech vstupů.
Math.Max=Na výstup Y předá největší hodnotu ze všech vstupů.

Comm.I2C.TMP75=TMP75 I2C Temperature sensor (nastavitelná I2C adresa 0x48..0x4F, výchozí 0x48).
IO.CH455G=WCH CH455G 7 Segment display driver (nastavitelné piny SCL/SDA DIO a aktivní maska číslic DigitMask).
